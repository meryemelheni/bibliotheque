apiVersion: v1
kind: ConfigMap
metadata:
  name: library-config
  namespace: library
data:
  NODE_ENV: production
  JWT_EXPIRATION: 1h
  JWT_REFRESH_EXPIRATION: 7d
  BOOKS_SERVICE_URL: http://books-service:3002
  USERS_SERVICE_URL: http://users-service:3001
  CRON_TIMEZONE: Africa/Tunis
  CORS_ORIGINS: http://library.local,http://localhost
  COOKIE_SECURE: "false"