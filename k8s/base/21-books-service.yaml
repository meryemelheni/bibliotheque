apiVersion: apps/v1
kind: Deployment
metadata:
  name: books-service
  namespace: library
spec:
  replicas: 1   # 1 seul replica : le PVC local-path est en ReadWriteOnce
  selector:
    matchLabels: {app: books-service}
  template:
    metadata:
      labels: {app: books-service}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: books-service
          image: ghcr.io/meryemelheni/books-service:latest
          imagePullPolicy: Always
          ports: [{containerPort: 3002}]
          envFrom:
            - configMapRef: {name: library-config}
          env:
            - {name: PORT, value: "3002"}
            - {name: DB_HOST, value: "postgres-books"}
            - {name: DB_PORT, value: "5432"}
            - {name: DB_NAME, value: "library_books"}
            - {name: DB_USER, value: "postgres"}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: library-secrets, key: POSTGRES_PASSWORD}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: library-secrets, key: JWT_SECRET}}
            - name: SERVICE_API_KEY
              valueFrom: {secretKeyRef: {name: library-secrets, key: SERVICE_API_KEY}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: uploads, mountPath: /app/uploads}
            - {name: tmp, mountPath: /tmp}
          startupProbe:
            httpGet: {path: /health, port: 3002}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health, port: 3002}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 3002}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
      volumes:
        - name: uploads
          persistentVolumeClaim: {claimName: books-uploads}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: books-service
  namespace: library
spec:
  selector: {app: books-service}
  ports: [{port: 3002, targetPort: 3002}]