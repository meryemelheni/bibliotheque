apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: library
spec:
  replicas: 2
  selector:
    matchLabels: {app: users-service}
  template:
    metadata:
      labels: {app: users-service}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: default # À remplacer par un SA dédié si tu le crées
      automountServiceAccountToken: false # Bonne pratique de sécurité
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
      affinity:
        podAntiAffinity: # Répartir les réplicas sur des nœuds différents
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels: {app: users-service}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: users-service
          image: ghcr.io/meryemelheni/users-service:latest
          imagePullPolicy: Always
          ports: [{containerPort: 3001}]
          envFrom:
            - configMapRef: {name: library-config}
          env:
            - {name: PORT, value: "3001"}
            - {name: DB_HOST, value: "postgres-users"}
            - {name: DB_PORT, value: "5432"}
            - {name: DB_NAME, value: "library_users"}
            - {name: DB_USER, value: "postgres"}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: library-secrets, key: POSTGRES_PASSWORD}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: library-secrets, key: JWT_SECRET}}
            # CORRECTION : Ajout de SERVICE_API_KEY manquant
            - name: SERVICE_API_KEY
              valueFrom: {secretKeyRef: {name: library-secrets, key: SERVICE_API_KEY}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # Sécurité renforcée
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - name: tmp
              mountPath: /tmp # Nécessaire pour readOnlyRootFilesystem
          startupProbe: # CORRECTION : Ajouté pour gérer les démarrages lents
            httpGet: {path: /health, port: 3001}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health, port: 3001}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 3001}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
  namespace: library
spec:
  selector: {app: users-service}
  ports: [{port: 3001, targetPort: 3001}]